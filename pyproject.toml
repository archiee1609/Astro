[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-vedic"
version = "2.0.0"
description = "High Precision Vedic Astrology and Sankhya Numerology System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "skyfield",
    "timezonefinder",
    "geopy",
    "fastapi",
    "uvicorn",
    "rich",
    "requests",
    "pandas",
    "streamlit",
    "jinja2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*"]
